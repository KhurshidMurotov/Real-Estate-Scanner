<!doctype html>
<html lang="ru">
  <head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оценка стоимости</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .active {
        background: #38bdf8 !important;
        color: white;
        border: 2px solid #fff;
        box-shadow: 0 0 10px #38bdf8;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="mx-auto max-w-lg px-4 pb-28 pt-6">
      <header class="mb-5">
        <div class="flex items-center justify-between">
          <h1 class="text-2xl font-semibold tracking-tight">Оценка стоимости</h1>
        </div>
        <p class="mt-2 text-sm text-slate-400">Выберите метод оценки и заполните параметры</p>
      </header>

      <!-- Метод оценки -->
      <section class="mb-4 rounded-2xl border border-slate-800 bg-slate-900/40 p-4">
        <p class="block text-sm font-medium text-slate-200 mb-3">Метод оценки</p>
        <div class="grid grid-cols-2 gap-2">
          <button
            id="tabById"
            type="button"
            class="rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2 text-sm font-medium text-slate-300 transition hover:border-slate-700 active"
            data-method="by_id"
          >
            По ID
          </button>
          <button
            id="tabByParams"
            type="button"
            class="rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2 text-sm font-medium text-slate-300 transition hover:border-slate-700"
            data-method="by_params"
          >
            По параметрам
          </button>
        </div>
      </section>

      <!-- Форма по ID -->
      <div id="formById" class="space-y-4">
        <section class="rounded-2xl border border-slate-800 bg-slate-900/40 p-4">
          <label for="adId" class="block text-sm font-medium text-slate-200">ID объявления OLX</label>
          <input
            id="adId"
            type="text"
            placeholder="Например: 12345678"
            class="mt-2 w-full rounded-xl bg-slate-950 px-3 py-2 text-slate-100 placeholder:text-slate-600 outline-none ring-1 ring-slate-800 focus:ring-2 focus:ring-sky-500/60"
          />
        </section>
      </div>

      <!-- Форма по параметрам -->
      <div id="formByParams" class="space-y-4 hidden">
        <!-- Тип объявления -->
        <section class="rounded-2xl border border-slate-800 bg-slate-900/40 p-4">
          <p class="block text-sm font-medium text-slate-200">Тип объявления *</p>
          <div class="mt-3 grid grid-cols-2 gap-2">
            <button
              id="tabSale"
              type="button"
              class="rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2 text-sm font-medium text-slate-300 transition hover:border-slate-700 active"
              data-type="sale"
            >
              Продажа
            </button>
            <button
              id="tabRent"
              type="button"
              class="rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2 text-sm font-medium text-slate-300 transition hover:border-slate-700"
              data-type="rent"
            >
              Аренда
            </button>
          </div>
        </section>

        <!-- Тип жилья -->
        <section class="rounded-2xl border border-slate-800 bg-slate-900/40 p-4">
          <p class="block text-sm font-medium text-slate-200">Тип жилья *</p>
          <div class="mt-3 grid grid-cols-2 gap-2">
            <button
              id="typeNew"
              type="button"
              class="housing-type-btn rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2 text-sm font-medium text-slate-300 transition hover:border-slate-700 active"
              data-value="new"
            >
              Новостройки
            </button>
            <button
              id="typeSecondary"
              type="button"
              class="housing-type-btn rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2 text-sm font-medium text-slate-300 transition hover:border-slate-700"
              data-value="secondary"
            >
              Вторичный рынок
            </button>
          </div>
        </section>

        <!-- Меблировка -->
        <section class="rounded-2xl border border-slate-800 bg-slate-900/40 p-4">
          <div class="flex items-center justify-between">
            <span class="text-sm font-medium text-slate-200">Меблировка *</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="furnished" class="sr-only peer">
              <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-sky-500"></div>
            </label>
          </div>
        </section>

        <!-- Комнаты -->
        <section class="rounded-2xl border border-slate-800 bg-slate-900/40 p-4">
          <label for="rooms" class="block text-sm font-medium text-slate-200">Количество комнат *</label>
          <input
            id="rooms"
            type="text"
            inputmode="numeric"
            placeholder="Например: 2"
            class="mt-2 w-full rounded-xl bg-slate-950 px-3 py-2 text-slate-100 placeholder:text-slate-600 outline-none ring-1 ring-slate-800 focus:ring-2 focus:ring-sky-500/60"
          />
        </section>

        <!-- Площадь -->
        <section class="rounded-2xl border border-slate-800 bg-slate-900/40 p-4">
          <label for="area" class="block text-sm font-medium text-slate-200">Общая площадь (м²) *</label>
          <input
            id="area"
            type="text"
            inputmode="decimal"
            placeholder="Например: 65.5"
            class="mt-2 w-full rounded-xl bg-slate-950 px-3 py-2 text-slate-100 placeholder:text-slate-600 outline-none ring-1 ring-slate-800 focus:ring-2 focus:ring-sky-500/60"
          />
        </section>

        <!-- Этаж -->
        <section class="rounded-2xl border border-slate-800 bg-slate-900/40 p-4">
          <label for="floor" class="block text-sm font-medium text-slate-200">Этаж *</label>
          <input
            id="floor"
            type="text"
            inputmode="numeric"
            placeholder="Например: 5"
            class="mt-2 w-full rounded-xl bg-slate-950 px-3 py-2 text-slate-100 placeholder:text-slate-600 outline-none ring-1 ring-slate-800 focus:ring-2 focus:ring-sky-500/60"
          />
        </section>

        <!-- Этажность дома -->
        <section class="rounded-2xl border border-slate-800 bg-slate-900/40 p-4">
          <label for="totalFloors" class="block text-sm font-medium text-slate-200">Этажность дома *</label>
          <input
            id="totalFloors"
            type="text"
            inputmode="numeric"
            placeholder="Например: 9"
            class="mt-2 w-full rounded-xl bg-slate-950 px-3 py-2 text-slate-100 placeholder:text-slate-600 outline-none ring-1 ring-slate-800 focus:ring-2 focus:ring-sky-500/60"
          />
        </section>

        <!-- Район -->
        <section class="rounded-2xl border border-slate-800 bg-slate-900/40 p-4">
          <label for="district" class="block text-sm font-medium text-slate-200">Район *</label>
          <select
            id="district"
            class="mt-2 w-full rounded-xl bg-slate-950 px-3 py-2 text-slate-100 outline-none ring-1 ring-slate-800 focus:ring-2 focus:ring-sky-500/60"
          >
            <option value="">Выберите район</option>
            <option value="yashnabadskiy">Яшнободский</option>
            <option value="yunusabadskiy">Юнусабадский</option>
            <option value="mirzoulugbek">Мирзо-Улугбекский</option>
            <option value="chilanzarskiy">Чиланзарский</option>
            <option value="yakkasarayskiy">Яккасарайский</option>
            <option value="shaykhontohur">Шайхантахурский</option>
            <option value="sergeli">Сергелийский</option>
            <option value="bektemir">Бектемирский</option>
            <option value="miraabad">Мирабадский</option>
            <option value="olmazar">Алмазарский</option>
            <option value=" uchtepa">Учтепинский</option>
            <option value="yashna">Яшнабадский</option>
          </select>
        </section>

        <!-- Расположение на карте -->
        <section class="rounded-2xl border border-slate-800 bg-slate-900/40 p-4">
          <p class="block text-sm font-medium text-slate-200 mb-2">Расположение на карте</p>
          <p class="text-xs text-slate-500 mb-3">Нажмите на карту, чтобы указать местоположение</p>
          <div class="rounded-xl overflow-hidden border border-slate-800">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d191986.79467197507!2d69.06353305!3d41.2994958!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x38ae8b0cc379e9c3%3A0xa5a9323b4c5e3b6a!2sTashkent%2C%20Uzbekistan!5e0!3m2!1sen!2s!4v1700000000000!5m2!1sen!2s"
              width="100%"
              height="200"
              style="border:0;"
              allowfullscreen=""
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
          </div>
          <input
            id="location"
            type="text"
            placeholder="Адрес или координаты"
            class="mt-3 w-full rounded-xl bg-slate-950 px-3 py-2 text-slate-100 placeholder:text-slate-600 outline-none ring-1 ring-slate-800 focus:ring-2 focus:ring-sky-500/60"
          />
        </section>
      </div>

      <!-- Дополнительные параметры (Accordion) -->
      <section class="rounded-2xl border border-slate-800 bg-slate-900/40 p-4">
        <details id="additionalParamsDetails">
          <summary class="cursor-pointer list-none select-none">
            <div class="flex items-center justify-between gap-3">
              <span class="text-sm font-medium text-slate-200">Дополнительные параметры</span>
              <span class="text-xs text-slate-500">Открыть/свернуть</span>
            </div>
          </summary>

          <div class="mt-4 grid gap-3">
            <div>
              <label for="bathrooms" class="block text-xs text-slate-400">Санузел</label>
              <input
                id="bathrooms"
                inputmode="numeric"
                type="text"
                placeholder="Напр. 1"
                class="mt-2 w-full rounded-xl bg-slate-950 px-3 py-2 text-slate-100 placeholder:text-slate-600 outline-none ring-1 ring-slate-800 focus:ring-2 focus:ring-sky-500/60"
              />
            </div>

            <div>
              <label for="renovation" class="block text-xs text-slate-400">Ремонт</label>
              <select
                id="renovation"
                class="mt-2 w-full rounded-xl bg-slate-950 px-3 py-2 text-slate-100 outline-none ring-1 ring-slate-800 focus:ring-2 focus:ring-sky-500/60"
              >
                <option value="" selected>Любой</option>
                <option value="new">Новый</option>
                <option value="good">Хороший</option>
                <option value="cosmetic">Косметический</option>
                <option value="needs_repair">Требует ремонта</option>
              </select>
            </div>

            <div>
              <label for="buildingYear" class="block text-xs text-slate-400">Год постройки</label>
              <input
                id="buildingYear"
                inputmode="numeric"
                type="text"
                placeholder="Напр. 2020"
                class="mt-2 w-full rounded-xl bg-slate-950 px-3 py-2 text-slate-100 placeholder:text-slate-600 outline-none ring-1 ring-slate-800 focus:ring-2 focus:ring-sky-500/60"
              />
            </div>
          </div>
        </details>
      </section>
    </div>

    <!-- Фиксированная кнопка оценки -->
    <div class="fixed bottom-0 inset-x-0 border-t border-slate-800 bg-slate-950/90 backdrop-blur">
      <div class="mx-auto max-w-lg px-4 py-3">
        <button
          id="evaluateBtn"
          type="button"
          class="w-full rounded-2xl bg-sky-500 px-4 py-4 text-base font-semibold text-white shadow-lg shadow-sky-500/20 transition hover:bg-sky-400 active:bg-sky-300"
        >
          Оценить стоимость
        </button>
      </div>
    </div>

    <script>
      function qs(id) {
        return document.getElementById(id);
      }

      function normalizeNumber(value) {
        if (value === null || value === undefined) return null;
        const trimmed = String(value).trim();
        if (!trimmed) return null;
        const cleaned = trimmed.replace(/\s+/g, "").replace(",", ".");
        const num = Number(cleaned);
        return Number.isFinite(num) ? num : null;
      }

      function normalizeInt(value) {
        const num = normalizeNumber(value);
        if (num === null) return null;
        return Math.trunc(num);
      }

      // Telegram WebApp init
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      // Переключение методов оценки
      const tabById = qs("tabById");
      const tabByParams = qs("tabByParams");
      const formById = qs("formById");
      const formByParams = qs("formByParams");
      let currentMethod = "by_id";

      function selectMethod(method) {
        if (method === "by_params") {
          tabByParams.classList.add("active");
          tabById.classList.remove("active");
          formByParams.classList.remove("hidden");
          formById.classList.add("hidden");
          currentMethod = "by_params";
        } else {
          tabById.classList.add("active");
          tabByParams.classList.remove("active");
          formById.classList.remove("hidden");
          formByParams.classList.add("hidden");
          currentMethod = "by_id";
        }
      }

      tabById.addEventListener("click", () => selectMethod("by_id"));
      tabByParams.addEventListener("click", () => selectMethod("by_params"));

      // Тип объявления
      const tabSale = qs("tabSale");
      const tabRent = qs("tabRent");
      let adType = "sale";

      function selectType(type) {
        if (type === "sale") {
          tabSale.classList.add("active");
          tabRent.classList.remove("active");
          adType = "sale";
        } else {
          tabRent.classList.add("active");
          tabSale.classList.remove("active");
          adType = "rent";
        }
      }

      tabSale.addEventListener("click", () => selectType("sale"));
      tabRent.addEventListener("click", () => selectType("rent"));

      // Тип жилья
      const typeNew = qs("typeNew");
      const typeSecondary = qs("typeSecondary");
      let housingType = "new";

      function selectHousingType(type) {
        if (type === "new") {
          typeNew.classList.add("active");
          typeSecondary.classList.remove("active");
          housingType = "new";
        } else {
          typeSecondary.classList.add("active");
          typeNew.classList.remove("active");
          housingType = "secondary";
        }
      }

      typeNew.addEventListener("click", () => selectHousingType("new"));
      typeSecondary.addEventListener("click", () => selectHousingType("secondary"));

      function buildPayload() {
        const basePayload = {
          valuation: {
            method: currentMethod,
          }
        };

        if (currentMethod === "by_id") {
          const adId = (qs("adId").value || "").trim() || null;
          basePayload.valuation.ad_id = adId;
        } else {
          const rooms = normalizeInt(qs("rooms").value);
          const area = normalizeNumber(qs("area").value);
          const floor = normalizeInt(qs("floor").value);
          const totalFloors = normalizeInt(qs("totalFloors").value);
          const district = qs("district").value || null;
          const location = (qs("location").value || "").trim() || null;
          const furnished = qs("furnished").checked;
          const bathrooms = normalizeInt(qs("bathrooms").value);
          const renovation = qs("renovation").value || null;
          const buildingYear = normalizeInt(qs("buildingYear").value);

          basePayload.valuation.params = {
            type: adType,
            housing_type: housingType,
            rooms: rooms,
            area: area,
            floor: floor,
            total_floors: totalFloors,
            district: district,
            location: location,
            furnished: furnished,
            bathrooms: bathrooms,
            renovation: renovation,
            building_year: buildingYear,
          };
        }

        return basePayload;
      }

      const evaluateBtn = qs("evaluateBtn");
      evaluateBtn.addEventListener("click", () => {
        const payload = buildPayload();
        const dataStr = JSON.stringify(payload);
        console.log("ОТПРАВКА ОЦЕНКИ:", dataStr);

        if (!tg || typeof tg.sendData !== "function") {
          console.log("Telegram WebApp не доступен: sendData недоступен");
          return;
        }
        tg.sendData(dataStr);
      });
    </script>
  </body>
</html>
